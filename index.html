<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Horas Tablet</title>
    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            font-family: sans-serif;
            position: relative; 
            cursor: pointer; 
        }
        
        /* BATERIA: Fica ancorada a 40 pixeis exatos do topo e da direita */
        #bateria-container {
            position: absolute;
            top: 40px; 
            right: 40px; 
            font-size: 24px; 
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaaaaa; 
            font-weight: bold;
        }

        /* RELÓGIO: Estado Normal (Centro exato) */
        #relogio {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            font-size: 25vw; 
            font-weight: bold;
            white-space: nowrap; 
            letter-spacing: 2vw; 
            transition: all 1s ease-in-out;
        }

        /* RELÓGIO: Estado Animado (Após o toque) */
        body.movido-para-cima #relogio {
            /* Fixa o relógio a 120 pixeis de distância do topo do ecrã */
            top: 120px; 
            /* O '0' no eixo Y impede que a animação o empurre para cima de si próprio */
            transform: translate(-50%, 0) scale(0.5); 
        }
    </style>
</head>
<body id="ecra">
    
    <div id="bateria-container">
        <span id="bateria-texto">--%</span>
        <span id="bateria-icone">🔋</span>
    </div>

    <div id="relogio">00:00</div>

    <script>
        // LÓGICA DO TOQUE PARA SUBIR E DESCER
        document.getElementById('ecra').addEventListener('click', function() {
            this.classList.toggle('movido-para-cima');
        });

        // LÓGICA DAS HORAS
        function atualizarTempo() {
            const agora = new Date();
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            document.getElementById('relogio').innerHTML = `${horas}:${minutos}`;
        }
        setInterval(atualizarTempo, 1000);
        atualizarTempo();

        // LÓGICA DA BATERIA
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                function atualizarBateria() {
                    const nivel = Math.round(battery.level * 100);
                    document.getElementById('bateria-texto').innerText = `${nivel}%`;
                    
                    if (battery.charging) {
                        document.getElementById('bateria-icone').innerText = '⚡';
                        document.getElementById('bateria-container').style.color = '#4CAF50'; 
                    } else {
                        document.getElementById('bateria-icone').innerText = '🔋';
                        document.getElementById('bateria-container').style.color = '#aaaaaa';
                    }
                }
                
                atualizarBateria(); 
                battery.addEventListener('levelchange', atualizarBateria);
                battery.addEventListener('chargingchange', atualizarBateria);
            });
        }
    </script>
</body>
</html>
