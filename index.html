<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            height: 100vh; 
            font-family: sans-serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
        }
        
        #bateria-container {
            position: absolute;
            top: 5vh; 
            right: 4vw; 
            font-size: 0.8vh; /* Reduzido para 1/4 do tamanho */
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaaaaa; 
            font-weight: bold;
        }

        #relogio-wrapper {
            transition: transform 1s ease-in-out;
        }

        #relogio {
            font-size: 20vw; 
            font-weight: 900; 
            letter-spacing: -3px; 
            margin: 0;
            line-height: 1; 
        }

        body.movido #relogio-wrapper {
            transform: translateY(-35vh); 
        }

        #instrucao-fullscreen {
            position: absolute;
            bottom: 10vh;
            color: #555;
            font-size: 2vh;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body id="ecra">
    
    <div id="bateria-container">
        <span id="txt-bateria">--%</span>
        <span id="ic-bateria">🔋</span>
    </div>

    <div id="relogio-wrapper">
        <div id="relogio">00:00</div>
    </div>

    <div id="instrucao-fullscreen">Toca no ecrã para iniciar o Ecrã Inteiro</div>

    <script>
        // -----------------------------------------------------
        // OS TEUS 4 BOTÕES DA PAREDE (LIDOS PELO PC)
        // -----------------------------------------------------
        const BOTAO_CIMA_ESQ  = 'a975eff6-4a64-4f1b-b7e1-74284a114bb1';
        const BOTAO_CIMA_DIR  = 'ed9d9822-f78e-4e2b-ad8b-d14739553733';
        const BOTAO_BAIXO_ESQ = 'ed6d6e4e-5f66-4a8d-8c81-2d45cc6f5fca';
        const BOTAO_BAIXO_DIR = 'dac769f4-e36c-452e-9166-52dcdfabf8e6';

        let temporizadorAnimacao = null;

        function ativarAnimacao() {
            document.body.classList.add('movido');
            if (temporizadorAnimacao) clearTimeout(temporizadorAnimacao);
            temporizadorAnimacao = setTimeout(() => { document.body.classList.remove('movido'); }, 8000);
        }

        // -----------------------------------------------------
        // A PONTE NATIVA: Esta função é chamada pelo Kotlin!
        // -----------------------------------------------------
        window.receberDadosDaBridge = function(base64Dados) {
            try {
                // Descodifica o Base64 que veio do tablet
                const jsonString = atob(base64Dados);
                const payload = JSON.parse(jsonString);

                for (const evento of payload) {
                    if (evento.type === 'update' && evento.data) {
                        for (const item of evento.data) {
                            
                            // Se for um botão e acabou de ser clicado
                            if (item.type === 'button' && item.button && item.button.last_event === 'initial_press') {
                                const idClicado = item.id;
                                
                                // Filtra APENAS para os 4 botões da parede (ignora o comando)
                                if ([BOTAO_CIMA_ESQ, BOTAO_CIMA_DIR, BOTAO_BAIXO_ESQ, BOTAO_BAIXO_DIR].includes(idClicado)) {
                                    
                                    ativarAnimacao(); // O Relógio sobe na hora!

                                    // Lógica futura preparada
                                    switch (idClicado) {
                                        case BOTAO_CIMA_ESQ: console.log("Clicaste Cima Esq"); break;
                                        case BOTAO_CIMA_DIR: console.log("Clicaste Cima Dir"); break;
                                        case BOTAO_BAIXO_ESQ: console.log("Clicaste Baixo Esq"); break;
                                        case BOTAO_BAIXO_DIR: console.log("Clicaste Baixo Dir"); break;
                                    }
                                }
                            }
                        }
                    }
                }
            } catch (erro) {
                // Ignora erros de leitura de JSON
            }
        };

        // -----------------------------------------------------
        // LÓGICA DO RESTO
        // -----------------------------------------------------
        const ecra = document.getElementById('ecra');
        const instrucao = document.getElementById('instrucao-fullscreen');

        ecra.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                if (ecra.requestFullscreen) ecra.requestFullscreen();
                else if (ecra.webkitRequestFullscreen) ecra.webkitRequestFullscreen();
                instrucao.style.opacity = '0';
            }
            ativarAnimacao();
        });

        function atualizarTempo() {
            const agora = new Date();
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            document.getElementById('relogio').innerHTML = horas + ':' + minutos;
        }
        setInterval(atualizarTempo, 1000);
        atualizarTempo();

        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                function atualizarBateria() {
                    const nivel = Math.round(battery.level * 100);
                    document.getElementById('txt-bateria').innerText = nivel + '%';
                    if (battery.charging) {
                        document.getElementById('ic-bateria').innerText = '⚡';
                        document.getElementById('bateria-container').style.color = '#4CAF50'; 
                    } else {
                        document.getElementById('ic-bateria').innerText = '🔋';
                        document.getElementById('bateria-container').style.color = '#aaaaaa';
                    }
                }
                atualizarBateria(); 
                battery.addEventListener('levelchange', atualizarBateria);
                battery.addEventListener('chargingchange', atualizarBateria);
            });
        }
    </script>
</body>
</html>
