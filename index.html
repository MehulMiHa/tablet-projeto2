<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            height: 100vh; 
            font-family: sans-serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
        }
        
        #bateria-container {
            position: absolute;
            top: 5vh; 
            right: 4vw; 
            font-size: 1.2vh; 
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaaaaa; 
            font-weight: bold;
            transition: color 0.3s;
        }

        #relogio-wrapper {
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
        }

        #relogio {
            font-size: 24vw; 
            font-weight: 900; 
            letter-spacing: -3px; 
            margin: 0;
            line-height: 1; 
        }

        body.movido #relogio-wrapper {
            transform: translateY(-28vh); 
        }

        /* -----------------------------------------------------
           BARRAS DE LUZ (TAMANHO TITÂNICO - 300vh)
           ----------------------------------------------------- */
        #painel-luzes {
            position: absolute;
            bottom: -50vh; /* Desci o painel inteiro porque os 300vh vão empurrar tudo para cima */
            display: flex;
            gap: 20vw; 
            
            opacity: 0;
            transform: translateY(15vh) scale(0.8);
            pointer-events: none;
            transition: opacity 0.5s ease-in, transform 0.5s ease-in;
            z-index: 5;
        }

        body.movido #painel-luzes {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            transition: opacity 0.6s ease-out 0.2s, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s;
        }

        .grupo-slider {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3vh;
        }

        .icone-luz {
            font-size: 5vh;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4));
            z-index: 2;
        }

        .caixa-slider {
            width: 10vw;
            /* SE FICARES SEM BOLINHA NO ECRÃ, MUDA OS 300vh ABAIXO PARA 80vh! */
            height: 300vh; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type=range].slider-girado {
            -webkit-appearance: none;
            appearance: none;
            /* O GIGANTE 300vh DE COMPRIMENTO */
            width: 300vh; 
            height: 4vw; 
            transform: rotate(-90deg);
            border-radius: 20px;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        input[type=range].slider-girado::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 7vw;
            height: 7vw;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
            border: 2px solid #ccc;
        }

        /* Barra 1: Brilho */
        #brilho-luz { 
            background: linear-gradient(to right, rgba(255,255,255,0.05), rgba(255,255,255,0.8)); 
        }
        
        /* Barra 2: Temperatura de Cor */
        #temp-luz { 
            background: linear-gradient(to right, #9bb3ff, #ffffff, #ffb347); 
        }

        #instrucao-fullscreen {
            position: absolute;
            bottom: 3vh;
            color: #444;
            font-size: 1.5vh;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body id="ecra">
    
    <div id="bateria-container">
        <span id="txt-bateria">--%</span>
        <span id="ic-bateria">🔋</span>
    </div>

    <div id="relogio-wrapper">
        <div id="relogio">00:00</div>
    </div>

    <!-- PAINEL DAS BARRAS 300vh -->
    <div id="painel-luzes">
        <!-- BARRA DA ESQUERDA (BRILHO) -->
        <div class="grupo-slider">
            <span class="icone-luz">☀️</span>
            <div class="caixa-slider">
                <input type="range" class="slider-girado" id="brilho-luz" min="1" max="254" value="128">
            </div>
        </div>
        
        <!-- BARRA DA DIREITA (TEMPERATURA) -->
        <div class="grupo-slider">
            <span class="icone-luz">🌡️</span>
            <div class="caixa-slider">
                <input type="range" class="slider-girado" id="temp-luz" min="153" max="500" value="326">
            </div>
        </div>
    </div>

    <div id="instrucao-fullscreen">Toca no fundo para iniciar o Ecrã Inteiro</div>

    <script>
        const BOTAO_CIMA_ESQ  = 'a975eff6-4a64-4f1b-b7e1-74284a114bb1';
        const BOTAO_CIMA_DIR  = 'ed9d9822-f78e-4e2b-ad8b-d14739553733';
        const BOTAO_BAIXO_ESQ = 'ed6d6e4e-5f66-4a8d-8c81-2d45cc6f5fca';
        const BOTAO_BAIXO_DIR = 'dac769f4-e36c-452e-9166-52dcdfabf8e6';

        let temporizadorAnimacao = null;

        function ativarAnimacao() {
            document.body.classList.add('movido');
            if (temporizadorAnimacao) clearTimeout(temporizadorAnimacao);
            temporizadorAnimacao = setTimeout(() => { document.body.classList.remove('movido'); }, 8000);
        }

        // Renova os 8 segundos sempre que arrastas um dos sliders
        document.getElementById('brilho-luz').addEventListener('input', ativarAnimacao);
        document.getElementById('temp-luz').addEventListener('input', ativarAnimacao);

        // PONTE NATIVA
        window.receberDadosDaBridge = function(base64Dados) {
            try {
                const bat = document.getElementById('bateria-container');
                bat.style.color = '#00ff00';
                setTimeout(() => { bat.style.color = '#aaaaaa'; }, 1000);

                const jsonString = atob(base64Dados);
                const payload = JSON.parse(jsonString);

                for (const evento of payload) {
                    if (evento.type === 'update' && evento.data) {
                        for (const item of evento.data) {
                            if (item.type === 'button' && item.button && item.button.last_event === 'initial_press') {
                                const idClicado = item.id;
                                if ([BOTAO_CIMA_ESQ, BOTAO_CIMA_DIR, BOTAO_BAIXO_ESQ, BOTAO_BAIXO_DIR].includes(idClicado)) {
                                    ativarAnimacao(); 
                                }
                            }
                        }
                    }
                }
            } catch (erro) {}
        };

        const ecra = document.getElementById('ecra');
        const instrucao = document.getElementById('instrucao-fullscreen');

        ecra.addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT') {
                if (!document.fullscreenElement) {
                    if (ecra.requestFullscreen) ecra.requestFullscreen();
                    else if (ecra.webkitRequestFullscreen) ecra.webkitRequestFullscreen();
                    instrucao.style.opacity = '0';
                }
                ativarAnimacao();
            }
        });

        function atualizarTempo() {
            const agora = new Date();
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            document.getElementById('relogio').innerHTML = horas + ':' + minutos;
        }
        setInterval(atualizarTempo, 1000);
        atualizarTempo();

        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                function atualizarBateria() {
                    const nivel = Math.round(battery.level * 100);
                    document.getElementById('txt-bateria').innerText = nivel + '%';
                    if (battery.charging) {
                        document.getElementById('ic-bateria').innerText = '⚡';
                        document.getElementById('bateria-container').style.color = '#4CAF50'; 
                    } else {
                        document.getElementById('ic-bateria').innerText = '🔋';
                        document.getElementById('bateria-container').style.color = '#aaaaaa';
                    }
                }
                atualizarBateria(); 
                battery.addEventListener('levelchange', atualizarBateria);
                battery.addEventListener('chargingchange', atualizarBateria);
            });
        }
    </script>
</body>
</html>
