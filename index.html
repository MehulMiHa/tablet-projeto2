<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; 
            transition: transform 3s ease-in-out; 
            justify-content: center;
            align-items: center;
        }

        #bateria-container { 
            position: absolute; 
            top: 5vh; 
            right: 4vw; 
            display: flex; 
            align-items: center; 
            font-size: 3vh; 
            font-weight: bold; 
            color: #aaa;
            z-index: 10;
        }

        /* Usamos a tua classe de layout do Eddy para o relógio */
        .header-container { 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: transform 1s ease-in-out;
        }
        
        #relogio { 
            font-size: 33vh; 
            font-weight: 900; 
            letter-spacing: -3px; 
            margin: 0; 
        }

        /* Animação quando toca */
        .movido {
            transform: translateY(-25vh) scale(0.6);
        }

    </style>
</head>
<body id="meu-ecra">

    <div id="bateria-container">
        <span id="txt-bateria">--%</span>
        <span id="ic-bateria">🔋</span>
    </div>

    <div class="header-container" id="caixa-relogio">
        <div id="relogio">00:00</div>
    </div>

    <script>
        // Relógio
        function atualizarTempo() {
            const agora = new Date();
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            document.getElementById('relogio').innerHTML = `${horas}:${minutos}`;
        }
        setInterval(atualizarTempo, 1000);
        atualizarTempo();

        // Bateria
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                function atualizarBateria() {
                    const nivel = Math.round(battery.level * 100);
                    document.getElementById('txt-bateria').innerText = `${nivel}%`;
                    
                    if (battery.charging) {
                        document.getElementById('ic-bateria').innerText = '⚡';
                        document.getElementById('bateria-container').style.color = '#4CAF50'; 
                    } else {
                        document.getElementById('ic-bateria').innerText = '🔋';
                        document.getElementById('bateria-container').style.color = '#aaa';
                    }
                }
                
                atualizarBateria(); 
                battery.addEventListener('levelchange', atualizarBateria);
                battery.addEventListener('chargingchange', atualizarBateria);
            });
        }

        // Toque
        document.getElementById('meu-ecra').addEventListener('click', function() {
            document.getElementById('caixa-relogio').classList.toggle('movido');
        });
    </script>
</body>
</html>
