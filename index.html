<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horas Tablet</title>
    <style>
        /* USANDO A TUA LÓGICA DO EDDY DASHBOARD */
        body {
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            height: 100vh; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
            /* Flexbox para centrar tudo naturalmente, sem coordenadas fixas! */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        /* BATERIA: Usa a mesma medida (vh/vw) que o teu rádio usava para não fugir */
        #bateria-container {
            position: absolute;
            top: 5vh; 
            right: 4vw; 
            font-size: 3vh; 
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaaaaa; 
            font-weight: bold;
        }

        /* CAIXA DO RELÓGIO (Envolve o relógio para a animação não o partir) */
        #relogio-wrapper {
            transition: transform 1s ease-in-out;
        }

        /* O RELÓGIO: Tamanho copiado do teu Eddy (33vh) para caber na perfeição */
        #relogio {
            font-size: 35vh; 
            font-weight: 900; 
            letter-spacing: -3px; 
            margin: 0;
            line-height: 1; /* Corta espaços invisíveis em cima e em baixo dos números */
        }

        /* ANIMAÇÃO QUANDO TOCAS NO ECRÃ */
        /* Sobe um pouco a partir do centro (30% da altura do ecrã) e fica mais pequeno */
        body.movido-para-cima #relogio-wrapper {
            transform: translateY(-28vh) scale(0.5); 
        }
    </style>
</head>
<body id="ecra">
    
    <div id="bateria-container">
        <span id="bateria-texto">--%</span>
        <span id="bateria-icone">🔋</span>
    </div>

    <div id="relogio-wrapper">
        <div id="relogio">00:00</div>
    </div>

    <script>
        // LÓGICA DO TOQUE (Alternar a animação)
        document.getElementById('ecra').addEventListener('click', function() {
            this.classList.toggle('movido-para-cima');
        });

        // LÓGICA DAS HORAS
        function atualizarTempo() {
            const agora = new Date();
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            document.getElementById('relogio').innerHTML = `${horas}:${minutos}`;
        }
        setInterval(atualizarTempo, 1000);
        atualizarTempo();

        // LÓGICA DA BATERIA
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                function atualizarBateria() {
                    const nivel = Math.round(battery.level * 100);
                    document.getElementById('bateria-texto').innerText = `${nivel}%`;
                    
                    if (battery.charging) {
                        document.getElementById('bateria-icone').innerText = '⚡';
                        document.getElementById('bateria-container').style.color = '#4CAF50'; 
                    } else {
                        document.getElementById('bateria-icone').innerText = '🔋';
                        document.getElementById('bateria-container').style.color = '#aaaaaa';
                    }
                }
                
                atualizarBateria(); 
                battery.addEventListener('levelchange', atualizarBateria);
                battery.addEventListener('chargingchange', atualizarBateria);
            });
        }
    </script>
</body>
</html>
