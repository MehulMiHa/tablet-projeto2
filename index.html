<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- Removi as limitações de ecrã para a página poder crescer o que quiser -->
    <style>
        body { 
            background-color: black; 
            color: #00ff00; /* Verde matrix */
            font-size: 24px; 
            font-family: monospace; 
            word-wrap: break-word; /* Força o texto a quebrar de linha */
            margin: 0; 
            padding: 20px; 
        }
    </style>
</head>
<body>
    <!-- Se vires esta frase, o HTML carregou mas o tablet bloqueou o JavaScript -->
    <div id="debug-text">HTML CARREGOU. A TENTAR LER O ECRÃ... SE VIRES ISTO, O TABLET BLOQUEOU O JAVASCRIPT!</div>

    <script>
        try {
            // Tira as medidas
            var largura = window.innerWidth;
            var altura = window.innerHeight;
            var ecraL = window.screen.width;
            var ecraA = window.screen.height;
            
            // A frase que vamos repetir
            var mensagem = "[WEBVIEW: " + largura + "x" + altura + " | FISICO: " + ecraL + "x" + ecraA + "] --- ";
            
            // Metralhadora: repete a frase 1000 vezes para encher o ecrã todo
            var textoGigante = "";
            for (var i = 0; i < 1000; i++) {
                textoGigante += mensagem;
            }
            
            // Substitui o texto no ecrã
            document.getElementById('debug-text').innerHTML = textoGigante;
            
        } catch (erro) {
            // Se o JavaScript crashar, imprime o erro
            document.getElementById('debug-text').innerHTML = "ERRO FATAL NO JAVASCRIPT: " + erro.message;
        }
    </script>
</body>
</html>
