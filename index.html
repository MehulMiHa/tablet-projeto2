<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horas Tablet</title>
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            padding: 0;
            width: 100vw;
            height: 100vh;
            font-family: sans-serif; 
            overflow: hidden; 
            position: relative;
        }

        /* BATERIA: Igual ao Eddy Dashboard (que tu gostaste) */
        #bateria-container { 
            position: absolute; 
            top: 5vh; 
            right: 4vw; 
            display: flex; 
            align-items: center; 
            font-size: 3vh; 
            font-weight: bold; 
            color: #aaa;
            z-index: 10;
        }

        /* RELÓGIO: Descida agressiva (Pus 80vh para ficar quase no fundo do ecrã) */
        #caixa-relogio { 
            position: absolute;
            top: 80vh; 
            left: 50vw;
            transform: translate(-50%, -50%);
            text-align: center; 
            transition: top 1s ease-in-out, transform 1s ease-in-out;
            width: 100%;
        }
        
        #relogio { 
            font-size: 30vw; 
            font-weight: bold; 
            margin: 0; 
            line-height: 1;
            letter-spacing: -3px;
        }

        /* ANIMAÇÃO: Quando toca, desce ainda mais 200px do que a posição anterior */
        body.movido #caixa-relogio {
            top: 650px !important; /* Estava 400px, subi 200px para 650px de distância do topo */
            transform: translate(-50%, 0) scale(0.6) !important;
        }
    </style>
</head>
<body id="meu-ecra">

    <div id="bateria-container">
        <span id="txt-bateria">--%</span>
        <span id="ic-bateria">🔋</span>
    </div>

    <div id="caixa-relogio">
        <div id="relogio">00:00</div>
    </div>

    <script>
        // Relógio
        function atualizarTempo() {
            const agora = new Date();
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            document.getElementById('relogio').innerHTML = horas + ':' + minutos;
        }
        setInterval(atualizarTempo, 1000);
        atualizarTempo();

        // Bateria
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                function atualizarBateria() {
                    const nivel = Math.floor(battery.level * 100);
                    document.getElementById('txt-bateria').innerText = nivel + '%';
                    
                    if (battery.charging) {
                        document.getElementById('ic-bateria').innerText = '⚡';
                        document.getElementById('bateria-container').style.color = '#4CAF50'; 
                    } else {
                        document.getElementById('ic-bateria').innerText = '🔋';
                        document.getElementById('bateria-container').style.color = '#aaa';
                    }
                }
                atualizarBateria(); 
                battery.addEventListener('levelchange', atualizarBateria);
                battery.addEventListener('chargingchange', atualizarBateria);
            });
        }

        // Toque
        document.getElementById('meu-ecra').addEventListener('click', function() {
            document.body.classList.toggle('movido');
        });
    </script>
</body>
</html>
