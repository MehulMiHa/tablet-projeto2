<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            height: 100vh; 
            font-family: sans-serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
        }
        
        #bateria-container {
            position: absolute;
            top: 5vh; 
            right: 4vw; 
            font-size: 1.5vh; 
            color: #aaaaaa; 
            font-weight: bold;
        }

        #relogio-wrapper {
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #temps-top {
            display: flex;
            gap: 6vw;
            font-size: 3vh;
            font-weight: bold;
            margin-bottom: 4vh; 
            transition: opacity 0.5s ease;
        }

        .label-out { color: #0abde3; font-weight: 900; text-shadow: 0 0 10px rgba(10, 189, 227, 0.5); margin-right: 1vw;}
        .label-in { color: #ff9f43; font-weight: 900; text-shadow: 0 0 10px rgba(255, 159, 67, 0.5); margin-right: 1vw;}

        #relogio {
            font-size: 24vw; 
            font-weight: 900; 
            letter-spacing: -3px; 
            margin: 0;
            line-height: 1; 
        }

        #chuva-hoje {
            font-size: 2.5vh;
            color: #48dbfb;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(72, 219, 251, 0.4);
            margin-top: 1vh;
            transition: opacity 0.5s ease;
        }

        body.movido #relogio-wrapper {
            transform: translateY(-30vh); 
        }

        body.movido #temps-top,
        body.movido #chuva-hoje {
            opacity: 0;
            pointer-events: none;
        }

        #painel-luzes {
            position: absolute;
            bottom: 16vh; 
            display: flex;
            gap: 12vw; 
            align-items: center; 
            opacity: 0;
            transform: translateY(15vh) scale(0.8);
            pointer-events: none;
            transition: opacity 0.5s ease-in, transform 0.5s ease-in;
            z-index: 5;
        }

        body.movido #painel-luzes {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            transition: opacity 0.6s ease-out 0.2s, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s;
        }

        .grupo-slider {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .icone-luz {
            font-size: 5vh;
            margin-bottom: 2vh;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4));
            z-index: 2;
        }

        .caixa-slider {
            position: relative;
            width: 10vw;
            height: 45vh; 
        }

        input[type=range].slider-girado {
            -webkit-appearance: none;
            appearance: none;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 45vh; 
            min-width: 45vh; 
            flex-shrink: 0; 
            height: 5vw; 
            transform: translate(-50%, -50%) rotate(-90deg);
            border-radius: 20px;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        input[type=range].slider-girado::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 9vw;
            height: 9vw;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
            border: 2px solid #ccc;
        }

        #brilho-luz { background: linear-gradient(to right, rgba(255,255,255,0.05), rgba(255,255,255,0.8)); }
        #temp-luz { background: linear-gradient(to right, #9bb3ff, #ffffff, #ffb347); }

        .coluna-central {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 7vh;
        }

        #btn-sync-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
            font-size: 1.5vh;
            font-weight: bold;
            padding: 1.5vh 2vw;
            border-radius: 15px;
            margin-bottom: 3vh; 
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            width: max-content;
        }

        #btn-sync-box.sync-active {
            background: rgba(229, 57, 53, 0.2); 
            border-color: #e53935;
            color: #ffcdd2;
            box-shadow: 0 0 15px rgba(229, 57, 53, 0.4);
        }

        #btn-power-sala {
            width: 9vw;
            height: 25vh;
            background: #d9d9d9;
            border-radius: 1vw;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s;
        }

        .metade-switch {
            width: 100%;
            height: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 2.5vh;
            font-family: sans-serif;
            transition: all 0.3s ease;
        }

        .switch-on {
            color: #999;
            background: linear-gradient(to bottom, #eeeeee, #cccccc);
            border-bottom: 2px solid #aaa;
        }
        .switch-off {
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255,51,51,0.5);
            background: linear-gradient(to bottom, #bbbbbb, #999999);
            box-shadow: inset 0 10px 10px rgba(0,0,0,0.2);
        }

        #btn-power-sala.ligado .switch-on {
            color: #33ff33;
            text-shadow: 0 0 12px rgba(51,255,51,0.8);
            background: linear-gradient(to bottom, #bbbbbb, #999999);
            box-shadow: inset 0 -10px 10px rgba(0,0,0,0.2);
            border-bottom: none;
        }
        #btn-power-sala.ligado .switch-off {
            color: #999;
            text-shadow: none;
            background: linear-gradient(to bottom, #cccccc, #eeeeee);
            box-shadow: none;
            border-top: 2px solid #fff;
        }

        #btn-opcoes {
            position: absolute;
            bottom: 1.5vh; 
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 1.5vh;
            font-weight: bold;
            padding: 1vh 4vw;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in;
        }

        body.movido #btn-opcoes {
            opacity: 1;
            pointer-events: auto;
        }

        #vista-secundaria {
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('fundo.jpg');
            background-size: cover;
            background-position: center;
            z-index: 999;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        #btn-voltar {
            margin-top: 8vh;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            font-size: 2.5vh;
            font-weight: bold;
            padding: 2vh 5vw;
            border-radius: 40px;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        #menu-botoes-avancados {
            display: flex;
            flex-direction: column;
            gap: 4vh;
            margin-top: 12vh;
            width: 70vw;
        }

        .btn-avancado {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 4vh;
            font-weight: bold;
            padding: 4vh 0;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.3s;
        }

        .btn-avancado:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body id="ecra">
    
    <div id="bateria-container">
        <span id="txt-bateria">--%</span>
    </div>

    <div id="relogio-wrapper">
        <div id="temps-top">
            <span><span class="label-out">OUT</span><span id="temp-out">--</span>°C</span>
            <span><span class="label-in">IN</span><span id="temp-in">--</span>°C</span>
        </div>
        
        <div id="relogio">00:00</div>
        
        <div id="chuva-hoje">🌧️ Chuva nas próximas 12h: --%</div>
    </div>

    <div id="painel-luzes">
        <div class="grupo-slider">
            <span class="icone-luz">☀️</span>
            <div class="caixa-slider">
                <input type="range" class="slider-girado" id="brilho-luz" min="1" max="254" value="1">
            </div>
        </div>
        
        <div class="coluna-central">
            <div id="btn-sync-box" onclick="toggleSyncBox()">
                🟢 Iniciar Sincronização TV
            </div>

            <div id="btn-power-sala" onclick="togglePowerSala()">
                <div class="metade-switch switch-on">ON</div>
                <div class="metade-switch switch-off">OFF</div>
            </div>
        </div>

        <div class="grupo-slider">
            <span class="icone-luz">🌡️</span>
            <div class="caixa-slider">
                <input type="range" class="slider-girado" id="temp-luz" min="153" max="500" value="153">
            </div>
        </div>
    </div>

    <button id="btn-opcoes" onclick="abrirOpcoes()">⚙️ Opções Avançadas</button>

    <div id="vista-secundaria">
        <button id="btn-voltar" onclick="fecharOpcoes()">⬅ Voltar ao Relógio</button>
        
        <div id="menu-botoes-avancados">
            <button class="btn-avancado">💡 Luzes</button>
            <button class="btn-avancado">🤖 Rocky</button>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES DA REDE
        const HUE_IP = '192.168.1.183';
        const HUE_TOKEN = 'ryqpfV2hzUw3ZkN-twiFBEMPUu-cN7CxHMFDaVSa';
        
        const SYNC_IP = '192.168.1.188'; 
        const SYNC_TOKEN = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3ODQwNjA1MzUzNDYsImlzcyI6ImhzYi1DNDI5OTYwNzZCMzIiLCJyb2xlIjoidXNlciIsInJpZCI6MTcsInJhbiI6InRhYmxldCIsInJpbiI6ImRhc2hib2FyZCJ9.kz3Ym/nPSs5bkVWqIZSzuyubq5Wiskk6PQeWBRzc0nc='; 
        
        const ID_GRUPO_SALA = '83'; 

        const BOTAO_CIMA_ESQ  = 'a975eff6-4a64-4f1b-b7e1-74284a114bb1';
        const BOTAO_CIMA_DIR  = 'ed9d9822-f78e-4e2b-ad8b-d14739553733';
        const BOTAO_BAIXO_ESQ = 'ed6d6e4e-5f66-4a8d-8c81-2d45cc6f5fca';
        const BOTAO_BAIXO_DIR = 'dac769f4-e36c-452e-9166-52dcdfabf8e6';

        let temporizadorAnimacao = null;
        let origemAnimacao = null; 
        let salaEstaLigada = false;
        let isSyncing = false;
        let grupoAtivo = '83'; 

        // ------------------------------------------------------------------------
        // COMUNICACAO NATIVA COM A SYNC BOX (Bypass ao bloqueio do Chrome)
        // ------------------------------------------------------------------------
        
        // Função chamada pelo Kotlin para devolver os dados da Sync Box
        window.receberDadosSyncBox = function(jsonString) {
            try {
                const data = JSON.parse(jsonString);
                if (data && data.syncActive !== undefined) {
                    isSyncing = data.syncActive;
                    atualizarUIBotaoSync();
                }
            } catch (e) {}
        };

        async function verificarEstadoSyncBox() {
            if (window.AndroidSync) {
                // Roteia via app Nativa Kotlin no tablet
                window.AndroidSync.comandoSyncBox(SYNC_IP, SYNC_TOKEN, "GET", false);
            } else {
                // Roteia via Fetch caso estejas a testar num browser normal
                try {
                    const res = await fetch(`https://${SYNC_IP}/api/v1/execution`, { headers: { 'Authorization': `Bearer ${SYNC_TOKEN}` } });
                    const data = await res.json();
                    receberDadosSyncBox(JSON.stringify(data));
                } catch(e) {}
            }
        }

        function atualizarUIBotaoSync() {
            const btnSync = document.getElementById('btn-sync-box');
            if(isSyncing) {
                btnSync.classList.add('sync-active');
                btnSync.innerHTML = '🔴 Parar Sincronização TV';
            } else {
                btnSync.classList.remove('sync-active');
                btnSync.innerHTML = '🟢 Iniciar Sincronização TV';
            }
        }

        function toggleSyncBox() {
            ativarAnimacao('touch');
            isSyncing = !isSyncing;
            atualizarUIBotaoSync();

            if (window.AndroidSync) {
                window.AndroidSync.comandoSyncBox(SYNC_IP, SYNC_TOKEN, "PUT", isSyncing);
            } else {
                fetch(`https://${SYNC_IP}/api/v1/execution`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${SYNC_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ "syncActive": isSyncing })
                }).catch(e => console.log(e));
            }
        }

        function autoStopSyncBlindly() {
            isSyncing = false;
            atualizarUIBotaoSync();
            
            if (window.AndroidSync) {
                window.AndroidSync.comandoSyncBox(SYNC_IP, SYNC_TOKEN, "PUT", false);
            } else {
                fetch(`https://${SYNC_IP}/api/v1/execution`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${SYNC_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ "syncActive": false })
                }).catch(e => console.log(e));
            }
        }

        // ------------------------------------------------------------------------

        async function sincronizarEstadoSala() {
            try {
                const res = await fetch(`http://${HUE_IP}/api/${HUE_TOKEN}/groups/${grupoAtivo}`);
                const data = await res.json();
                
                if (data && data.action) {
                    salaEstaLigada = data.action.on;
                    const btn = document.getElementById('btn-power-sala');
                    
                    if (salaEstaLigada) btn.classList.add('ligado');
                    else btn.classList.remove('ligado');
                    
                    document.getElementById('brilho-luz').value = data.action.bri;
                    if(data.action.ct) document.getElementById('temp-luz').value = data.action.ct; 
                }
            } catch (e) {}

            verificarEstadoSyncBox();
        }

        function ativarAnimacao(origem = null) {
            const telaFechada = !document.body.classList.contains('movido');

            if (origem) {
                if (telaFechada || origem !== 'touch') {
                    origemAnimacao = origem; 
                    
                    if (origem === 'touch') grupoAtivo = '83'; 
                    else if (origem === BOTAO_CIMA_ESQ || origem === BOTAO_BAIXO_ESQ) grupoAtivo = '84'; 
                    else if (origem === BOTAO_CIMA_DIR || origem === BOTAO_BAIXO_DIR) grupoAtivo = '82'; 
                }
            }
            
            if (telaFechada) {
                autoStopSyncBlindly();
            }

            if (telaFechada || (origem && origem !== 'touch')) {
                sincronizarEstadoSala();
            }

            document.body.classList.add('movido');
            
            if (temporizadorAnimacao) clearTimeout(temporizadorAnimacao);
            temporizadorAnimacao = setTimeout(() => { 
                document.body.classList.remove('movido'); 
                origemAnimacao = null; 
                grupoAtivo = '83'; 
            }, 8000);
        }

        function mudarLuzSala(propriedade, valor) {
            const corpo = { "on": true };
            corpo[propriedade] = parseInt(valor);

            salaEstaLigada = true;
            document.getElementById('btn-power-sala').classList.add('ligado');

            fetch(`http://${HUE_IP}/api/${HUE_TOKEN}/groups/${grupoAtivo}/action`, {
                method: 'PUT',
                body: JSON.stringify(corpo)
            }).catch(e => console.log(e));
        }

        function togglePowerSala() {
            ativarAnimacao('touch');
            salaEstaLigada = !salaEstaLigada;
            
            const btn = document.getElementById('btn-power-sala');
            if (salaEstaLigada) btn.classList.add('ligado');
            else btn.classList.remove('ligado');

            fetch(`http://${HUE_IP}/api/${HUE_TOKEN}/groups/${grupoAtivo}/action`, {
                method: 'PUT',
                body: JSON.stringify({ "on": salaEstaLigada })
            }).catch(e => console.log(e));
        }

        document.getElementById('brilho-luz').addEventListener('input', () => ativarAnimacao('touch'));
        document.getElementById('temp-luz').addEventListener('input', () => ativarAnimacao('touch'));

        document.getElementById('brilho-luz').addEventListener('change', function() {
            mudarLuzSala('bri', this.value);
        });
        document.getElementById('temp-luz').addEventListener('change', function() {
            mudarLuzSala('ct', this.value);
        });

        function abrirOpcoes() {
            document.getElementById('vista-secundaria').style.display = 'flex';
            document.body.classList.remove('movido'); 
            origemAnimacao = null;
        }

        function fecharOpcoes() {
            document.getElementById('vista-secundaria').style.display = 'none';
        }

        window.receberDadosDaBridge = function(base64Dados) {
            try {
                const jsonString = atob(base64Dados);
                const payload = JSON.parse(jsonString);

                for (const evento of payload) {
                    if (evento.type === 'update' && evento.data) {
                        for (const item of evento.data) {
                            if (item.type === 'button' && item.button && item.button.last_event === 'initial_press') {
                                if ([BOTAO_CIMA_ESQ, BOTAO_CIMA_DIR, BOTAO_BAIXO_ESQ, BOTAO_BAIXO_DIR].includes(item.id)) {
                                    if (document.getElementById('vista-secundaria').style.display !== 'flex') {
                                        ativarAnimacao(item.id); 
                                    }
                                }
                            }
                        }
                    }
                }
            } catch (erro) {}
        };

        const ecra = document.getElementById('ecra');
        ecra.addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && !e.target.classList.contains('metade-switch') && e.target.id !== 'btn-power-sala' && e.target.id !== 'btn-sync-box' && e.target.id !== 'txt-sync') {
                if (!document.fullscreenElement) {
                    if (ecra.requestFullscreen) ecra.requestFullscreen();
                    else if (ecra.webkitRequestFullscreen) ecra.webkitRequestFullscreen();
                }
                ativarAnimacao('touch'); 
            }
        });

        function atualizarTempo() {
            const agora = new Date();
            document.getElementById('relogio').innerHTML = String(agora.getHours()).padStart(2, '0') + ":" + String(agora.getMinutes()).padStart(2, '0');
        }

        async function getOutdoorTemp() {
            try {
                const url = `https://api.openweathermap.org/data/2.5/weather?q=Santo+Antonio+dos+Cavaleiros,PT&appid=8a3fe8fecca47dfc4859d6c3ef1a0214&units=metric&lang=pt`;
                const response = await fetch(url);
                const data = await response.json();
                document.getElementById('temp-out').innerText = Math.round(data.main.temp);
            } catch (e) { document.getElementById('temp-out').innerText = "Err"; }
        }

        async function getRainChance() {
            try {
                const url = `https://api.openweathermap.org/data/2.5/forecast?q=Santo+Antonio+dos+Cavaleiros,PT&appid=8a3fe8fecca47dfc4859d6c3ef1a0214&units=metric&lang=pt`;
                const response = await fetch(url);
                const data = await response.json();
                let maxPop = 0;
                for(let i = 0; i < 4; i++) { 
                    if(data.list[i] && data.list[i].pop > maxPop) maxPop = data.list[i].pop; 
                }
                document.getElementById('chuva-hoje').innerText = `🌧️ Chuva nas próximas 12h: ${Math.round(maxPop * 100)}%`;
            } catch (e) { document.getElementById('chuva-hoje').innerText = `🌧️ Chuva: Err`; }
        }

        async function getIndoorTemp() {
            try {
                const url = `http://${HUE_IP}/api/${HUE_TOKEN}/sensors/34`;
                const response = await fetch(url);
                const data = await response.json();
                document.getElementById('temp-in').innerText = Math.round(data.state.temperature / 100);
            } catch (e) { document.getElementById('temp-in').innerText = "Err"; }
        }

        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                function atualizarBateria() {
                    document.getElementById('txt-bateria').innerText = Math.round(battery.level * 100) + '%';
                }
                atualizarBateria(); 
                battery.addEventListener('levelchange', atualizarBateria);
            });
        }

        setInterval(atualizarTempo, 1000);
        setInterval(getOutdoorTemp, 600000); 
        setInterval(getRainChance, 600000);  
        setInterval(getIndoorTemp, 60000);   
        
        atualizarTempo();
        getOutdoorTemp();
        getRainChance();
        getIndoorTemp();
    </script>
</body>
</html>
