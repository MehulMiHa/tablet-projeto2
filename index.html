<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horas Tablet</title>
    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            font-family: sans-serif;
            position: relative; 
            cursor: pointer; /* Útil se testares no computador, mostra a mãozinha */
        }
        
        /* 1. BATERIA (Reduzida para ~1/3 do tamanho) */
        #bateria-container {
            position: absolute;
            top: 3%;
            right: 4%;
            font-size: 1.5vh; /* Era 4vh, agora está bem mais pequeno */
            display: flex;
            align-items: center;
            gap: 4px;
            color: #aaaaaa; 
            font-weight: bold;
            transition: color 0.5s;
        }

        /* 2. RELÓGIO NO CENTRO (Estado Normal) */
        #relogio {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28vw; 
            font-weight: bold;
            white-space: nowrap; 
            letter-spacing: 2vw; 
            /* A ordem que cria a animação de deslize: */
            transition: top 1s ease-in-out, transform 1s ease-in-out, font-size 1s ease-in-out;
        }

        /* 3. RELÓGIO NO TOPO (Estado após o toque) */
        #relogio.movido-para-cima {
            top: 8%; /* Sobe até perto do topo */
            transform: translate(-50%, 0); /* Ajusta para não cortar a parte de cima */
            font-size: 18vw; /* Fica um pouco mais pequeno para não esmagar a bateria. Podes mudar este valor se quiseres que mantenha o tamanho gigante. */
        }
    </style>
</head>
<body>
    
    <div id="bateria-container">
        <span id="bateria-texto">--%</span>
        <span id="bateria-icone">🔋</span>
    </div>

    <div id="relogio">00:00</div>

    <script>
        // LÓGICA DO TOQUE (DESLIZE)
        document.body.addEventListener('click', function() {
            const relogio = document.getElementById('relogio');
            // O "toggle" faz com que se tocares ele sobe, se voltares a tocar ele desce
            relogio.classList.toggle('movido-para-cima');
        });

        // LÓGICA DAS HORAS
        function atualizarTempo() {
            const agora = new Date();
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            document.getElementById('relogio').innerHTML = `${horas}:${minutos}`;
        }
        setInterval(atualizarTempo, 1000);
        atualizarTempo();

        // LÓGICA DA BATERIA
        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(battery) {
                function atualizarBateria() {
                    const nivel = Math.round(battery.level * 100);
                    document.getElementById('bateria-texto').innerText = `${nivel}%`;
                    
                    if (battery.charging) {
                        document.getElementById('bateria-icone').innerText = '⚡';
                        document.getElementById('bateria-container').style.color = '#4CAF50'; 
                    } else {
                        document.getElementById('bateria-icone').innerText = '🔋';
                        document.getElementById('bateria-container').style.color = '#aaaaaa';
                    }
                }
                
                atualizarBateria(); 
                battery.addEventListener('levelchange', atualizarBateria);
                battery.addEventListener('chargingchange', atualizarBateria);
            });
        }
    </script>
</body>
</html>
