<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            height: 100vh; 
            font-family: sans-serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centra o relógio na vertical */
            align-items: center;
        }
        
        #bateria-container {
            position: absolute;
            top: 5vh; 
            right: 4vw; 
            font-size: 3vh; 
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaaaaa; 
            font-weight: bold;
        }

        #relogio-wrapper {
            transition: transform 1s ease-in-out;
        }

        #relogio {
            font-size: 35vh; 
            font-weight: 900; 
            letter-spacing: -3px; 
            margin: 0;
            line-height: 1; 
        }

        /* Animação do toque - Sobe 28% do ecrã e reduz o tamanho */
        body.movido #relogio-wrapper {
            transform: translateY(-28vh) scale(0.5); 
        }

        /* Instrução Inicial para o Utilizador (Desaparece após o primeiro toque) */
        #instrucao-fullscreen {
            position: absolute;
            bottom: 10vh;
            color: #555;
            font-size: 2vh;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body id="ecra">
    
    <div id="bateria-container">
        <span id="txt-bateria">--%</span>
        <span id="ic-bateria">🔋</span>
    </div>

    <div id="relogio-wrapper">
        <div id="relogio">00:00</div>
    </div>

    <div id="instrucao-fullscreen">Toca no ecrã para iniciar o Ecrã Inteiro</div>

    <script>
        const ecra = document.getElementById('ecra');
        const instrucao = document.getElementById('instrucao-fullscreen');

        // Lógica do Toque (Ativar Ecrã Inteiro E fazer a Animação)
        ecra.addEventListener('click', function() {
            // 1. OBRIGAR O TABLET A FICAR EM ECRÃ INTEIRO
            if (!document.fullscreenElement) {
                if (ecra.requestFullscreen) {
                    ecra.requestFullscreen();
                } else if (ecra.webkitRequestFullscreen) { /* Safari */
                    ecra.webkitRequestFullscreen();
                } else if (ecra.msRequestFullscreen) { /* IE11 */
                    ecra.msRequestFullscreen();
                }
                // Esconde a instrução após entrar em Ecrã Inteiro
                instrucao.style.opacity = '0';
            }

            // 2. ALTERNAR A ANIMAÇÃO DO RELÓGIO
            document.body.classList.toggle('movido');
        });

        // Relógio
        function atualizarTempo() {
            const agora = new Date();
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            document.getElementById('relogio').innerHTML = horas + ':' + minutos;
        }
        setInterval(atualizarTempo, 1000);
        atualizarTempo();

        // Bateria
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                function atualizarBateria() {
                    const nivel = Math.round(battery.level * 100);
                    document.getElementById('txt-bateria').innerText = nivel + '%';
                    
                    if (battery.charging) {
                        document.getElementById('ic-bateria').innerText = '⚡';
                        document.getElementById('bateria-container').style.color = '#4CAF50'; 
                    } else {
                        document.getElementById('ic-bateria').innerText = '🔋';
                        document.getElementById('bateria-container').style.color = '#aaaaaa';
                    }
                }
                atualizarBateria(); 
                battery.addEventListener('levelchange', atualizarBateria);
                battery.addEventListener('chargingchange', atualizarBateria);
            });
        }
    </script>
</body>
</html>
