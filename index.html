<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* VARIÁVEIS PARA O MOTOR ANTI BURN-IN */
        :root {
            --burn-x: 0vw;
            --burn-y: 0vh;
        }

        html, body { 
            overscroll-behavior: none; 
            touch-action: none; 
        }

        body { 
            background-color: #000; 
            color: #fff; 
            margin: 0; 
            height: 100vh; 
            font-family: sans-serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
        }

        #fundo-luzes-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1; 
            opacity: 0;
            transform: translateY(30vh) perspective(1000px) rotateX(60deg) scale(0.8);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none; 
        }

        body.movido #fundo-luzes-container {
            opacity: 0.65; 
            transform: translateY(-5vh) perspective(1000px) rotateX(35deg) scale(1.1);
        }

        /* O MODO "SELECIONADOR" */
        body.luz-avancada #fundo-luzes-container {
            opacity: 1; 
            transform: translateY(5vh) perspective(1000px) rotateX(0deg) scale(0.85); 
            transition: opacity 1.6s ease, transform 1.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* --- CAMADA 1: VISUAIS INTOCÁVEIS --- */
        .visual-forma {
            transition: stroke 0.3s ease, opacity 0.5s ease;
            pointer-events: none !important; /* Desliga totalmente toques nos desenhos puros */
        }

        /* Cores e Efeitos no Modo Avançado (Mantêm a cor original, mas respiram/piscam) */
        body.luz-avancada .visual-forma {
            opacity: 0.3; /* Não selecionadas ficam adormecidas no fundo */
        }
        
        body.luz-avancada .visual-forma.selecionada {
            opacity: 1; 
            animation: respirar-selecionado 2s infinite ease-in-out; /* O pulsar premium */
        }

        @keyframes respirar-selecionado {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* --- CAMADA 2: HITBOXES GIGANTES --- */
        .hitboxes-layer {
            pointer-events: none; /* Desligado no relógio */
        }
        body.luz-avancada .hitboxes-layer {
            pointer-events: auto; /* Ligado no Selecionador! */
        }
        .luz-hitbox {
            fill: rgba(0, 0, 0, 0.01); /* 1% Preto! Força o tablet a detetar toques em 100% da área */
            cursor: pointer;
            pointer-events: all;
            -webkit-tap-highlight-color: transparent;
        }

        #bateria-container {
            position: absolute;
            top: 5vh; 
            right: 4vw; 
            font-size: 1.5vh; 
            color: #aaaaaa; 
            font-weight: bold;
            z-index: 20;
            transform: translate(calc(var(--burn-x) * 0.5), calc(var(--burn-y) * 0.2));
            transition: transform 0.8s ease;
        }

        #relogio-wrapper {
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(var(--burn-x), var(--burn-y));
        }

        #temps-top {
            display: flex;
            justify-content: space-between; 
            width: 40vw; 
            font-size: 3vh;
            font-weight: bold;
            margin-bottom: 4vh; 
            transition: opacity 0.5s ease;
        }

        .label-out { color: #0abde3; font-weight: 900; text-shadow: 0 0 10px rgba(10, 189, 227, 0.5); margin-right: 1vw;}
        .label-in { color: #ff9f43; font-weight: 900; text-shadow: 0 0 10px rgba(255, 159, 67, 0.5); margin-right: 1vw;}

        #relogio {
            font-size: 24vw; 
            font-weight: 900; 
            letter-spacing: -3px; 
            margin: 0;
            line-height: 1; 
            text-shadow: 0 5px 15px rgba(0,0,0,0.8); 
        }

        #chuva-hoje {
            font-size: 2.5vh;
            color: #48dbfb;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(72, 219, 251, 0.4);
            margin-top: 1vh;
            transition: opacity 0.5s ease;
        }

        body.movido #relogio-wrapper {
            transform: translate(var(--burn-x), -30vh); 
            opacity: 1;
        }

        body.luz-avancada #relogio-wrapper {
            transition: transform 1.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.6s ease;
            transform: translate(var(--burn-x), -100vh); 
            opacity: 0;
        }

        body.movido #temps-top,
        body.movido #chuva-hoje {
            opacity: 0;
            pointer-events: none;
        }

        #painel-luzes {
            position: absolute;
            bottom: 16vh; 
            display: flex;
            justify-content: center; 
            width: 100vw; 
            align-items: center; 
            opacity: 0;
            transform: translateY(15vh) scale(0.8);
            pointer-events: none;
            transition: opacity 0.5s ease-in, transform 0.5s ease-in;
            z-index: 15;
        }

        body.movido #painel-luzes {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            transition: opacity 0.6s ease-out 0.2s, transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s;
        }

        /* MAGIA PURA: O painel tem de desligar cliques em Luz Avançada para não tapar os Focos centrais! */
        body.luz-avancada #painel-luzes {
            pointer-events: none !important;
        }

        .grupo-slider {
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 1.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.6s ease;
        }

        body.luz-avancada #painel-luzes .grupo-slider:first-child {
            transform: translateX(-40vw);
            opacity: 0;
        }

        body.luz-avancada #painel-luzes .grupo-slider:last-child {
            transform: translateX(40vw);
            opacity: 0;
        }

        .icone-luz {
            font-size: 5vh;
            margin-bottom: 2vh;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4));
            z-index: 2;
        }

        .caixa-slider {
            position: relative;
            width: 10vw;
            height: 45vh; 
        }

        input[type=range].slider-girado {
            -webkit-appearance: none;
            appearance: none;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 45vh; 
            min-width: 45vh; 
            flex-shrink: 0; 
            height: 5vw; 
            transform: translate(-50%, -50%) rotate(-90deg);
            border-radius: 20px;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            touch-action: none; 
        }

        input[type=range].slider-girado::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 9vw;
            height: 9vw;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
            border: 2px solid #ccc;
        }

        #brilho-luz { background: linear-gradient(to right, rgba(255,255,255,0.05), rgba(255,255,255,0.8)); }
        #temp-luz { background: linear-gradient(to right, #9bb3ff, #ffffff, #ffb347); }

        .coluna-central {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 4vw; 
        }

        #lbl-grupo-ativo {
            font-size: 3vh;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            transition: color 0.3s ease, transform 1.6s cubic-bezier(0.25, 1, 0.5, 1);
            margin-bottom: 2.5vh; 
            text-align: center;
        }

        body.luz-avancada #lbl-grupo-ativo {
            transform: translateY(-28vh) scale(1.5); 
        }

        body.luz-avancada #btn-sync-box,
        body.luz-avancada #btn-power-sala {
            opacity: 0;
        }

        #btn-sync-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #aaa;
            font-size: 1.5vh;
            font-weight: bold;
            padding: 1.5vh 2vw;
            border-radius: 15px;
            margin-bottom: 3vh; 
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease, opacity 0.5s ease; 
            backdrop-filter: blur(5px);
            width: max-content;
        }

        #btn-sync-box.sync-active {
            background: rgba(229, 57, 53, 0.2); 
            border-color: #e53935;
            color: #ffcdd2;
            box-shadow: 0 0 15px rgba(229, 57, 53, 0.4);
        }

        #btn-power-sala {
            width: 9vw;
            height: 25vh;
            background: #d9d9d9;
            border-radius: 1vw;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s, opacity 0.5s ease; 
        }

        .metade-switch {
            width: 100%;
            height: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 2.5vh;
            font-family: sans-serif;
            transition: all 0.3s ease;
        }

        .switch-on {
            color: #999;
            background: linear-gradient(to bottom, #eeeeee, #cccccc);
            border-bottom: 2px solid #aaa;
        }
        .switch-off {
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255,51,51,0.5);
            background: linear-gradient(to bottom, #bbbbbb, #999999);
            box-shadow: inset 0 10px 10px rgba(0,0,0,0.2);
        }

        #btn-power-sala.ligado .switch-on {
            color: #33ff33;
            text-shadow: 0 0 12px rgba(51,255,51,0.8);
            background: linear-gradient(to bottom, #bbbbbb, #999999);
            box-shadow: inset 0 -10px 10px rgba(0,0,0,0.2);
            border-bottom: none;
        }
        #btn-power-sala.ligado .switch-off {
            color: #999;
            text-shadow: none;
            background: linear-gradient(to bottom, #cccccc, #eeeeee);
            box-shadow: none;
            border-top: 2px solid #fff;
        }

        #botoes-rodape-container {
            position: absolute;
            bottom: 2vh; 
            display: flex;
            justify-content: center;
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in;
        }

        body.movido #botoes-rodape-container {
            opacity: 1;
            pointer-events: auto;
        }
        
        body.luz-avancada #botoes-rodape-container {
            opacity: 0;
            pointer-events: none;
        }

        .btn-rodape {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 2vh;
            font-weight: bold;
            padding: 1.5vh 5vw;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.3s, transform 0.1s;
        }

        .btn-rodape:nth-child(2) {
            margin-left: 6vw; 
        }

        .btn-rodape:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        /* --- ESTILOS DO PAINEL ROCKY --- */
        #vista-rocky {
            display: none; 
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.4)), url('fundo.jpg');
            background-size: cover;
            background-position: center;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        #titulo-rocky {
            font-size: 4vh; 
            font-weight: bold; 
            margin-top: 2vh; 
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255,255,255,0.4);
        }

        #rocky-conteudo, #rocky-conteudo-config {
            display: flex;
            width: 92vw;
            flex: 1;
            margin-top: 3vh;
            overflow: hidden;
            flex-direction: column;
        }

        #rocky-headers {
            display: flex;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 2vh;
        }

        .coluna-acao {
            width: 47%; 
            display: flex;
            flex-direction: column;
        }

        .titulo-coluna {
            text-align: center;
            font-weight: bold;
            font-size: 2.8vh;
            margin-bottom: 1.5vh;
        }

        .btn-selecionar-tudo {
            background: rgba(255, 255, 255, 0.1);
            color: #ddd;
            border: 1px dashed rgba(255,255,255,0.3);
            font-size: 1.8vh;
            padding: 1.5vh;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .btn-selecionar-tudo:active { background: rgba(255, 255, 255, 0.3); }

        .lista-scroll {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            width: 100%;
            padding-bottom: 5vh; 
            -ms-overflow-style: none; 
            scrollbar-width: none; 
        }
        .lista-scroll::-webkit-scrollbar { display: none; }

        .linha-divisao {
            display: flex;
            width: 100%;
            justify-content: space-between; 
            margin-bottom: 2vh; 
        }

        .btn-divisao {
            width: 47%; 
            background: rgba(255, 255, 255, 0.08); 
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: white; 
            font-size: 1.8vh; 
            padding: 1.8vh 1vw; 
            border-radius: 12px; 
            cursor: pointer; 
            backdrop-filter: blur(10px);
            text-align: center; 
            font-weight: bold;
            transition: all 0.2s ease-out;
        }

        .btn-divisao.selecionado-asp {
            background: rgba(255, 235, 59, 0.2); 
            border-color: #ffeb3b;
            box-shadow: 0 0 15px rgba(255, 235, 59, 0.4);
            color: #fff;
        }

        .btn-divisao.selecionado-lav {
            background: rgba(33, 150, 243, 0.3); 
            border-color: #4fc3f7;
            box-shadow: 0 0 15px rgba(33, 150, 243, 0.5);
            color: #fff;
        }

        #rocky-footer, #rocky-footer-config {
            display: flex;
            justify-content: space-between;
            width: 92vw;
            padding: 3vh 0;
            margin-top: auto;
        }

        .btn-footer-rocky {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 2.2vh;
            font-weight: bold;
            padding: 2vh 4vw;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        
        #btn-continuar, #btn-iniciar {
            background: rgba(76, 175, 80, 0.4);
            border-color: #4caf50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
            transition: all 0.3s ease;
        }

        .painel-config-rocky {
            display: flex;
            width: 100%;
            justify-content: space-around;
            align-items: center;
            margin-top: 5vh;
        }
        .slider-label {
            text-align: center;
            font-size: 2vh;
            font-weight: bold;
            margin-top: 3vh;
            color: #ccc;
        }
        #slider-succao { background: linear-gradient(to right, rgba(255,235,59,0.1), #ffeb3b); }
        #slider-agua { background: linear-gradient(to right, rgba(33,150,243,0.1), #4fc3f7); }

    </style>
</head>
<body id="ecra">
    
    <div id="fundo-luzes-container">
        <!-- O preserveAspectRatio garante as proporções originais -->
        <svg viewBox="0 0 600 900" width="90vw" height="100vh" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Filtro AUMENTADO para 200% para não cortar o brilho -->
                <filter id="brilhoNeon" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="15" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>
            
            <!-- CAMADA 1: VISUAL (Não faz absolutamente nada ao toque, apenas pinta no ecrã) -->
            <g style="pointer-events: none;">
                <rect id="visual-sanca" class="visual-forma selecionada" x="30" y="30" width="540" height="840" rx="15" fill="none" stroke="#222" stroke-width="35" filter="url(#brilhoNeon)"/>

                <!-- O Filtro fica no grupo para partilharem o brilho e não criar quadrados -->
                <g filter="url(#brilhoNeon)">
                    <!-- LINHA 1 -->
                    <circle id="visual-foco-4" class="visual-forma selecionada foco-forma" cx="200" cy="170" r="50" fill="none" stroke="#222" stroke-width="35" />
                    <circle id="visual-foco-8" class="visual-forma selecionada foco-forma" cx="400" cy="170" r="50" fill="none" stroke="#222" stroke-width="35" />
                    <!-- LINHA 2 -->
                    <circle id="visual-foco-3" class="visual-forma selecionada foco-forma" cx="200" cy="350" r="50" fill="none" stroke="#222" stroke-width="35" />
                    <circle id="visual-foco-7" class="visual-forma selecionada foco-forma" cx="400" cy="350" r="50" fill="none" stroke="#222" stroke-width="35" />
                    <!-- LINHA 3 -->
                    <circle id="visual-foco-2" class="visual-forma selecionada foco-forma" cx="200" cy="530" r="50" fill="none" stroke="#222" stroke-width="35" />
                    <circle id="visual-foco-6" class="visual-forma selecionada foco-forma" cx="400" cy="530" r="50" fill="none" stroke="#222" stroke-width="35" />
                    <!-- LINHA 4 -->
                    <circle id="visual-foco-1" class="visual-forma selecionada foco-forma" cx="200" cy="710" r="50" fill="none" stroke="#222" stroke-width="35" />
                    <circle id="visual-foco-5" class="visual-forma selecionada foco-forma" cx="400" cy="710" r="50" fill="none" stroke="#222" stroke-width="35" />
                </g>
            </g>

            <!-- CAMADA 2: HITBOXES (Retângulos transparentes gigantes para captar os dedos. Ficam por cima dos visuais) -->
            <g id="hitboxes" class="hitboxes-layer">
                <!-- Hitbox da Sanca AUMENTADO: Vai da margem 10 à 580 (apanha mesmo que falhes o desenho por pouco) -->
                <rect id="hitbox-sanca" x="10" y="10" width="580" height="880" rx="25" class="luz-hitbox" />
                
                <!-- Os Focos são quadrados de 160x160 pixeis (enormes) exatamente centrados nas bolas -->
                <rect id="hitbox-foco-4" x="120" y="90" width="160" height="160" rx="20" class="luz-hitbox" />
                <rect id="hitbox-foco-8" x="320" y="90" width="160" height="160" rx="20" class="luz-hitbox" />
                
                <rect id="hitbox-foco-3" x="120" y="270" width="160" height="160" rx="20" class="luz-hitbox" />
                <rect id="hitbox-foco-7" x="320" y="270" width="160" height="160" rx="20" class="luz-hitbox" />
                
                <rect id="hitbox-foco-2" x="120" y="450" width="160" height="160" rx="20" class="luz-hitbox" />
                <rect id="hitbox-foco-6" x="320" y="450" width="160" height="160" rx="20" class="luz-hitbox" />
                
                <rect id="hitbox-foco-1" x="120" y="630" width="160" height="160" rx="20" class="luz-hitbox" />
                <rect id="hitbox-foco-5" x="320" y="630" width="160" height="160" rx="20" class="luz-hitbox" />
            </g>
        </svg>
    </div>

    <div id="bateria-container">
        <span id="txt-bateria">--%</span>
    </div>

    <div id="relogio-wrapper">
        <div id="temps-top">
            <span><span class="label-out">OUT</span><span id="temp-out">--</span>°C</span>
            <span><span class="label-in">IN</span><span id="temp-in">--</span>°C</span>
        </div>
        
        <div id="relogio">00:00</div>
        
        <div id="chuva-hoje">🌧️ Chuva nas próximas 12h: --%</div>
    </div>

    <div id="painel-luzes">
        <div class="grupo-slider">
            <span class="icone-luz">☀️</span>
            <div class="caixa-slider">
                <input type="range" class="slider-girado" id="brilho-luz" min="1" max="254" value="1">
            </div>
        </div>
        
        <div class="coluna-central">
            <div id="lbl-grupo-ativo">SALA</div>

            <div id="btn-sync-box" onclick="toggleSyncBox()">
                🟢 Iniciar Sincronização TV
            </div>

            <div id="btn-power-sala" onclick="togglePowerSala()">
                <div class="metade-switch switch-on">ON</div>
                <div class="metade-switch switch-off">OFF</div>
            </div>
        </div>

        <div class="grupo-slider">
            <span class="icone-luz">🌡️</span>
            <div class="caixa-slider">
                <input type="range" class="slider-girado" id="temp-luz" min="153" max="500" value="153">
            </div>
        </div>
    </div>

    <div id="botoes-rodape-container">
        <button class="btn-rodape" onclick="toggleLuzAvançada(event)">Selecionador 💡</button>
        <button class="btn-rodape" onclick="abrirVistaRocky(event)">🤖 Rocky</button>
    </div>

    <div id="vista-rocky">
        <button id="btn-voltar-rocky" onclick="fecharVistaRocky()" style="margin-top: 5vh; background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(255, 255, 255, 0.5); color: white; font-size: 2vh; padding: 1vh 4vw; border-radius: 40px; cursor: pointer;">⬅ Voltar ao Relógio</button>
        <div id="titulo-rocky">Onde desejas limpar?</div>
        <div id="msg-carregando" style="margin-top: 10vh; color: #aaa; font-size: 2.2vh; text-align: center;"></div>
        
        <div id="rocky-conteudo" style="display: none;">
            
            <div id="rocky-headers">
                <div class="coluna-acao">
                    <div class="titulo-coluna" style="color: #ffeb3b;">🧹 Aspirar</div>

        const SYNC_IP = '192.168.1.188';

        const BOTAO_CIMA_ESQ  = 'a975eff6-4a64-4f1b-b7e1-74284a114bb1';

        let origemAnimacao = null;

        let isSyncing = false;
        
        let estado82 = { on: false, bri: 254, ct: 326 };
        let estado84 = { on: false, bri: 254, ct: 326 };

        // ==========================================
        // SISTEMA DE SEGURANÇA 10 SEG INATIVIDADE

        let timerInatividade = null;

        function resetInatividade() {

                    document.body.classList.remove('luz-avancada');

                    document.body.classList.remove('movido');

                atualizarBurnIn();

        }

        document.addEventListener('touchstart', resetInatividade, {passive: true});
        document.addEventListener('click', resetInatividade, {passive: true});
        document.addEventListener('input', resetInatividade, {passive: true});

        // ==========================================
        // LÓGICA DO SELECIONADOR INTELIGENTE DE LUZES
        // ==========================================
        let luzesSelecionadas = new Set(['sanca', 'foco-1', 'foco-2', 'foco-3', 'foco-4', 'foco-5', 'foco-6', 'foco-7', 'foco-8']);

            'foco-1': '11',

            'foco-3': '9',   
            'foco-4': '7',   
            'foco-5': '6',   
            'foco-6': '8',   
            'foco-7': '15',  
            'foco-8': '14'

        function atualizarLabelSelecao() {
            const temSanca = luzesSelecionadas.has('sanca');
            const focos = [];
            
            for (let i = 1; i <= 8; i++) {
                if (luzesSelecionadas.has('foco-' + i)) focos.push(i);
            }
            
            let texto = "";
            
            if (temSanca && focos.length === 8) {
                texto = "SALA";
            } else if (!temSanca && focos.length === 8) {
                texto = "FOCOS";
            } else if (temSanca && focos.length === 0) {
                texto = "SANCA";
            } else {
                let partes = [];
                if (temSanca) partes.push("SANCA");
                if (focos.length > 0) partes.push("FOCOS " + focos.join(" "));
                texto = partes.join(" | ");
            }
            
            if (texto === "") texto = "NENHUMA LUZ";
            
            document.getElementById('lbl-grupo-ativo').innerText = texto;
        }

        // LÓGICA COM OS NOVOS HITBOXES INVISÍVEIS!
        document.querySelectorAll('.luz-hitbox').forEach(hitbox => {
            hitbox.addEventListener('click', function(e) {
                if (!document.body.classList.contains('luz-avancada')) return;
                
                e.stopPropagation(); 
                resetInatividade();
                
                // Pega no id da hitbox (ex: hitbox-foco-1) e transforma no id real visual (ex: foco-1)
                const realId = this.id.replace('hitbox-', '');
                const visual = document.getElementById('visual-' + realId);
                
                if (luzesSelecionadas.has(realId)) {
                    luzesSelecionadas.delete(realId);
                    if(visual) visual.classList.remove('selecionada');
                } else {
                    luzesSelecionadas.add(realId);
                    if(visual) visual.classList.add('selecionada');
                }
                
                atualizarLabelSelecao();
            });
        });

        function enviarComandoHueCerebro(corpo) {
            const temSanca = luzesSelecionadas.has('sanca');
            const focosAtivos = [];
            for (let i = 1; i <= 8; i++) {
                if (luzesSelecionadas.has('foco-' + i)) focosAtivos.push(i);
            }

            if (temSanca && focosAtivos.length === 8) {
                fetch(`http://${HUE_IP}/api/${HUE_TOKEN}/groups/83/action`, { method: 'PUT', body: JSON.stringify(corpo) }).catch(e => {});
            } else if (!temSanca && focosAtivos.length === 8) {
                fetch(`http://${HUE_IP}/api/${HUE_TOKEN}/groups/84/action`, { method: 'PUT', body: JSON.stringify(corpo) }).catch(e => {});
            } else if (temSanca && focosAtivos.length === 0) {
                fetch(`http://${HUE_IP}/api/${HUE_TOKEN}/groups/82/action`, { method: 'PUT', body: JSON.stringify(corpo) }).catch(e => {});
            } else {
                if (temSanca) {
                    fetch(`http://${HUE_IP}/api/${HUE_TOKEN}/groups/82/action`, { method: 'PUT', body: JSON.stringify(corpo) }).catch(e => {});
                }
                focosAtivos.forEach(numFoco => {
                    const idRealHue = MAPA_LUZES_INDIVIDUAIS['foco-' + numFoco];
                    if (idRealHue) {
                        fetch(`http://${HUE_IP}/api/${HUE_TOKEN}/lights/${idRealHue}/state`, { method: 'PUT', body: JSON.stringify(corpo) }).catch(e => {});
                    }
                });
            }
        }

        // ==========================================
        // ANTI BURN-IN MOTOR (PROTEÇÃO ECRÃ AMOLED)
        // ==========================================
        function atualizarBurnIn() {
            if (document.body.classList.contains('movido')) return; 

            const agora = Date.now();
            const cicloVertical = 12 * 60 * 60 * 1000; 
            const eixoY = Math.sin((agora % cicloVertical) / cicloVertical * Math.PI * 2) * 18;
            const cicloHorizontal = 60 * 60 * 1000;
            const eixoX = Math.sin((agora % cicloHorizontal) / cicloHorizontal * Math.PI * 2) * 3;

            document.documentElement.style.setProperty('--burn-y', `${eixoY}vh`);
            document.documentElement.style.setProperty('--burn-x', `${eixoX}vw`);
        }
        
        atualizarBurnIn();
        setInterval(atualizarBurnIn, 60000); 

        function calcularCorLuz(estado) {
            if (!estado.on) return 'rgba(100, 100, 100, 0.4)'; 

            let ct = estado.ct || 326; 
            let r, g, b;
            
            if (ct < 326) {
                let pct = (ct - 153) / (326 - 153);
                r = Math.round(200 + pct * 55); 
                g = Math.round(220 + pct * 35); 
                b = 255;
            } else {
                let pct = (ct - 326) / (500 - 326);
                r = 255;
                g = Math.round(255 - pct * 80);  
                b = Math.round(255 - pct * 150); 
            }

            let alpha = (estado.bri / 254) * 0.6 + 0.4;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function atualizarCoresFundo3D() {
            const rect82 = document.getElementById('visual-sanca');
            if(rect82) rect82.style.stroke = calcularCorLuz(estado82);
            
            document.querySelectorAll('.foco-forma').forEach(f => f.style.stroke = calcularCorLuz(estado84));
        }

        window.receberDadosSyncBox = function(jsonString) {
            try {
                const data = JSON.parse(jsonString);
                if (data && data.syncActive !== undefined) {
                    isSyncing = data.syncActive;
                    atualizarUIBotaoSync();
                }
            } catch (e) {}
        };

        async function verificarEstadoSyncBox() {
            if (window.AndroidSync) {
                window.AndroidSync.comandoSyncBox(SYNC_IP, SYNC_TOKEN, "GET", false);
            } else {
                try {
                    const res = await fetch(`https://${SYNC_IP}/api/v1/execution`, { headers: { 'Authorization': `Bearer ${SYNC_TOKEN}` } });
                    const data = await res.json();
                    receberDadosSyncBox(JSON.stringify(data));
                } catch(e) {}
            }
        }

        function atualizarUIBotaoSync() {
            const btnSync = document.getElementById('btn-sync-box');
            if(isSyncing) {
                btnSync.classList.add('sync-active');
                btnSync.innerHTML = '🔴 Parar Sincronização TV';
            } else {
                btnSync.classList.remove('sync-active');
                btnSync.innerHTML = '🟢 Iniciar Sincronização TV';
            }
        }

        function toggleSyncBox() {
            ativarAnimacao('touch');
            isSyncing = !isSyncing;
            atualizarUIBotaoSync();

            if (window.AndroidSync) {
                window.AndroidSync.comandoSyncBox(SYNC_IP, SYNC_TOKEN, "PUT", isSyncing);
            } else {
                fetch(`https://${SYNC_IP}/api/v1/execution`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${SYNC_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ "syncActive": isSyncing })
                }).catch(e => console.log(e));
            }
        }

        function autoStopSyncBlindly() {
            isSyncing = false;
            atualizarUIBotaoSync();
            
            if (window.AndroidSync) {
                window.AndroidSync.comandoSyncBox(SYNC_IP, SYNC_TOKEN, "PUT", false);
            } else {
                fetch(`https://${SYNC_IP}/api/v1/execution`, {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${SYNC_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ "syncActive": false })
                }).catch(e => console.log(e));
            }
        }

        async function sincronizarEstadoSala() {
            try {
                const p82 = fetch(`http://${HUE_IP}/api/${HUE_TOKEN}/groups/82`).then(r => r.json());
                const p84 = fetch(`http://${HUE_IP}/api/${HUE_TOKEN}/groups/84`).then(r => r.json());
                
                const [d82, d84] = await Promise.all([p82, p84]);
                
                if (d82 && d82.action) estado82 = d82.action;
                if (d84 && d84.action) estado84 = d84.action;

                atualizarCoresFundo3D();

                let dadosAtivos = estado84;
                if (luzesSelecionadas.has('sanca') && luzesSelecionadas.size === 1) dadosAtivos = estado82;
                
                if (luzesSelecionadas.has('sanca') && luzesSelecionadas.size === 9) {
                    const res83 = await fetch(`http://${HUE_IP}/api/${HUE_TOKEN}/groups/83`);
                    const d83 = await res83.json();
                    if (d83 && d83.action) dadosAtivos = d83.action;
                }
                
                salaEstaLigada = dadosAtivos.on;
                const btn = document.getElementById('btn-power-sala');
                if (salaEstaLigada) btn.classList.add('ligado');
                else btn.classList.remove('ligado');
                
                document.getElementById('brilho-luz').value = dadosAtivos.bri;
                if(dadosAtivos.ct) document.getElementById('temp-luz').value = dadosAtivos.ct; 

            } catch (e) {}

            verificarEstadoSyncBox();
        }

        window.toggleLuzAvançada = function(e) {
            if (e) e.stopPropagation(); 
            
            if(document.body.classList.contains('luz-avancada')){
                document.body.classList.remove('luz-avancada');
                atualizarLabelSelecao();
            } else {
                document.body.classList.add('luz-avancada');
                atualizarLabelSelecao();
            }
            
            resetInatividade();
        };

        function ativarAnimacao(origem = null) {
            const telaFechada = !document.body.classList.contains('movido');
            
            if (document.body.classList.contains('luz-avancada') && (!origem || origem === 'touch')) {
                document.body.classList.remove('luz-avancada');
                atualizarLabelSelecao();
            }

            if (origem && origem !== 'touch') {
                origemAnimacao = origem; 
                luzesSelecionadas.clear();
                
                if (origem === BOTAO_CIMA_DIR || origem === BOTAO_BAIXO_DIR) {
                    luzesSelecionadas.add('sanca');
                } else if (origem === BOTAO_CIMA_ESQ || origem === BOTAO_BAIXO_ESQ) {
                    for(let i=1; i<=8; i++) luzesSelecionadas.add('foco-'+i);
                }
                
                document.querySelectorAll('.visual-forma').forEach(luz => {
                    const realId = luz.id.replace('visual-', '');
                    if(luzesSelecionadas.has(realId)) luz.classList.add('selecionada');
                    else luz.classList.remove('selecionada');
                });
            }
            
            atualizarLabelSelecao();
            
            if (telaFechada) {
                autoStopSyncBlindly();
            }

            if (telaFechada || (origem && origem !== 'touch')) {
                sincronizarEstadoSala();
            }

            document.body.classList.add('movido');
            resetInatividade();
        }

        function mudarLuzSala(propriedade, valor) {
            const corpo = { "on": true };
            corpo[propriedade] = parseInt(valor);

            salaEstaLigada = true;
            document.getElementById('btn-power-sala').classList.add('ligado');

            if (luzesSelecionadas.has('sanca')) {
                estado82.on = true;
                estado82[propriedade] = parseInt(valor);
            }
            if (luzesSelecionadas.size > 1 || (!luzesSelecionadas.has('sanca') && luzesSelecionadas.size > 0)) {
                estado84.on = true;
                estado84[propriedade] = parseInt(valor);
            }
            atualizarCoresFundo3D();

            enviarComandoHueCerebro(corpo);
        }

        function togglePowerSala() {
            ativarAnimacao('touch');
            salaEstaLigada = !salaEstaLigada;
            
            const btn = document.getElementById('btn-power-sala');
            if (salaEstaLigada) btn.classList.add('ligado');
            else btn.classList.remove('ligado');

            if (luzesSelecionadas.has('sanca')) estado82.on = salaEstaLigada;
            if (luzesSelecionadas.size > 1 || (!luzesSelecionadas.has('sanca') && luzesSelecionadas.size > 0)) estado84.on = salaEstaLigada;
            atualizarCoresFundo3D();

            enviarComandoHueCerebro({ "on": salaEstaLigada });
        }

        document.getElementById('brilho-luz').addEventListener('input', function() {
            ativarAnimacao('touch');
            if (luzesSelecionadas.has('sanca')) { estado82.on = true; estado82.bri = parseInt(this.value); }
            if (luzesSelecionadas.size > 1 || (!luzesSelecionadas.has('sanca') && luzesSelecionadas.size > 0)) { estado84.on = true; estado84.bri = parseInt(this.value); }
            atualizarCoresFundo3D();
        });
        
        document.getElementById('temp-luz').addEventListener('input', function() {
            ativarAnimacao('touch');
            if (luzesSelecionadas.has('sanca')) { estado82.on = true; estado82.ct = parseInt(this.value); }
            if (luzesSelecionadas.size > 1 || (!luzesSelecionadas.has('sanca') && luzesSelecionadas.size > 0)) { estado84.on = true; estado84.ct = parseInt(this.value); }
            atualizarCoresFundo3D();
        });

        document.getElementById('brilho-luz').addEventListener('change', function() { mudarLuzSala('bri', this.value); });
        document.getElementById('temp-luz').addEventListener('change', function() { mudarLuzSala('ct', this.value); });

        let selecaoAspirar = new Set();
        let selecaoLavar = new Set();
        let divisoesMapa = [];

        window.abrirVistaRocky = function(e) {
            if (e) e.stopPropagation(); 
            document.getElementById('rocky-conteudo-config').style.display = 'none';
            document.getElementById('vista-rocky').style.display = 'flex';
            document.getElementById('titulo-rocky').innerText = "Onde desejas limpar?";
            
            resetInatividade();
            carregarMapaRocky();
        };

        function fecharVistaRocky() {
            document.getElementById('vista-rocky').style.display = 'none';
            document.body.classList.remove('movido'); 
            document.body.classList.remove('luz-avancada');
            origemAnimacao = null;
        }

        async function carregarMapaRocky() {
            document.getElementById('rocky-conteudo').style.display = 'none';
            const msg = document.getElementById('msg-carregando');
            msg.innerHTML = 'A comunicar com o servidor e a obter o mapa...';
            msg.style.display = 'block';
            
            selecaoAspirar.clear();
            selecaoLavar.clear();

            try {
                const response = await fetch('http://127.0.0.1:3000/api/rocky/rooms');
                const data = await response.json();
                
                msg.style.display = 'none'; 

                if(data.rooms) {
                    divisoesMapa = data.rooms;
                    document.getElementById('rocky-conteudo').style.display = 'flex';
                    renderizarListasRocky();
                } else {
                    msg.innerHTML = '<div style="color: #ff4444;">Erro ao ler o mapa JSON do servidor.</div>';
                    msg.style.display = 'block';
                }
            } catch(e) {
                msg.innerHTML = '<div style="color: #ff4444;">Não foi possível contactar o servidor Rocky. O Node.js está ligado?</div>';
                msg.style.display = 'block';
            }
        }

        function renderizarListasRocky() {
            const listaContainer = document.getElementById('lista-unificada-scroll');
            listaContainer.innerHTML = '';

            divisoesMapa.forEach(room => {
                const linha = document.createElement('div');
                linha.className = 'linha-divisao';

                const btnAsp = document.createElement('button');
                btnAsp.className = 'btn-divisao';
                btnAsp.innerHTML = room.rawName;
                btnAsp.id = `btn-asp-${room.segmentId}`;
                btnAsp.onclick = () => { toggleSala('aspirar', room.segmentId); resetInatividade(); };
                
                const btnLav = document.createElement('button');
                btnLav.className = 'btn-divisao';
                btnLav.innerHTML = room.rawName;
                btnLav.id = `btn-lav-${room.segmentId}`;
                btnLav.onclick = () => { toggleSala('lavar', room.segmentId); resetInatividade(); };
                
                linha.appendChild(btnAsp);
                linha.appendChild(btnLav);
                listaContainer.appendChild(linha);
            });
        }

        function toggleSala(tipo, id) {
            const set = tipo === 'aspirar' ? selecaoAspirar : selecaoLavar;
            const classNome = tipo === 'aspirar' ? 'selecionado-asp' : 'selecionado-lav';
            const prefixo = tipo === 'aspirar' ? 'btn-asp-' : 'btn-lav-';
            const btn = document.getElementById(prefixo + id);

            if (set.has(id)) {
                set.delete(id);
                btn.classList.remove(classNome);
            } else {
                set.add(id);
                btn.classList.add(classNome);
            }
        }

        function toggleSelecionarTudo(tipo) {
            resetInatividade();
            const set = tipo === 'aspirar' ? selecaoAspirar : selecaoLavar;
            const classNome = tipo === 'aspirar' ? 'selecionado-asp' : 'selecionado-lav';
            const prefixo = tipo === 'aspirar' ? 'btn-asp-' : 'btn-lav-';
            
            const todasSelecionadas = divisoesMapa.every(r => set.has(r.segmentId));

            divisoesMapa.forEach(room => {
                const btn = document.getElementById(prefixo + room.segmentId);
                if (todasSelecionadas) {
                    set.delete(room.segmentId);
                    btn.classList.remove(classNome);
                } else {
                    set.add(room.segmentId);
                    btn.classList.add(classNome);
                }
            });
        }

        function desenharMapa() {
            resetInatividade();
            const btn = document.getElementById('btn-area');
            const txtOriginal = btn.innerHTML;
            btn.innerHTML = "Em breve!";
            setTimeout(() => { btn.innerHTML = txtOriginal; }, 2000);
        }

        function avancarLimpeza() {
            resetInatividade();
            const arrayAspirar = Array.from(selecaoAspirar);
            const arrayLavar = Array.from(selecaoLavar);
            
            if (arrayAspirar.length === 0 && arrayLavar.length === 0) {
                const btn = document.getElementById('btn-continuar');
                const txtOriginal = btn.innerHTML;
                btn.innerHTML = "⚠️ Escolhe 1 Divisão!";
                btn.style.background = "rgba(244, 67, 54, 0.4)";
                setTimeout(() => { 
                    btn.innerHTML = txtOriginal; 
                    btn.style.background = "rgba(76, 175, 80, 0.4)"; 
                }, 2000);
                return;
            }

            const containerSuccao = document.getElementById('container-succao');
            const containerAgua = document.getElementById('container-agua');

            if (arrayAspirar.length > 0 && arrayLavar.length === 0) {
                containerSuccao.style.display = 'flex';
                containerAgua.style.display = 'none';
            } else if (arrayLavar.length > 0 && arrayAspirar.length === 0) {
                containerSuccao.style.display = 'none';
                containerAgua.style.display = 'flex';
            } else {
                containerSuccao.style.display = 'flex';
                containerAgua.style.display = 'flex';
            }

            document.getElementById('rocky-conteudo').style.display = 'none';
            document.getElementById('titulo-rocky').innerText = "Ajustar Intensidade";
            document.getElementById('rocky-conteudo-config').style.display = 'flex';
        }

        function voltarParaDivisoes() {
            resetInatividade();
            document.getElementById('rocky-conteudo-config').style.display = 'none';
            document.getElementById('titulo-rocky').innerText = "Onde desejas limpar?";
            document.getElementById('rocky-conteudo').style.display = 'flex';
        }

        const niveisSuccao = { '101': 'Silencioso', '102': 'Normal', '103': 'Turbo', '104': 'Máximo' };

        document.getElementById('slider-succao').addEventListener('input', function() {
            document.getElementById('lbl-succao').innerText = niveisSuccao[this.value];
        });

        document.getElementById('slider-agua').addEventListener('input', function() {
            document.getElementById('lbl-agua').innerText = 'Nível ' + this.value;
        });

        async function enviarComandoFinal() {
            resetInatividade();
            const arrayAspirar = Array.from(selecaoAspirar);
            const arrayLavar = Array.from(selecaoLavar);
            const succao = parseInt(document.getElementById('slider-succao').value);
            const agua = parseInt(document.getElementById('slider-agua').value);

            const botaoIniciar = document.getElementById('btn-iniciar');
            const txtOriginal = botaoIniciar.innerText;
            
            botaoIniciar.innerText = "A Enviar Ordem...";
            botaoIniciar.style.background = "rgba(255, 152, 0, 0.4)"; 
            botaoIniciar.disabled = true;

            const payload = {
                divisoesAspirar: arrayAspirar,
                divisoesLavar: arrayLavar,
                nivelSuccao: succao,
                nivelAgua: agua
            };

            try {
                const res = await fetch('http://127.0.0.1:3000/api/rocky/clean', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    botaoIniciar.innerText = "Sucesso! A iniciar...";
                    botaoIniciar.style.background = "rgba(76, 175, 80, 0.8)";
                    setTimeout(() => { fecharVistaRocky(); }, 2000);
                } else {
                    botaoIniciar.innerText = "Falta lógica Node.js!";
                    botaoIniciar.style.background = "rgba(244, 67, 54, 0.8)";
                }
            } catch(e) {
                botaoIniciar.innerText = "Erro: Servidor Offline";
                botaoIniciar.style.background = "rgba(244, 67, 54, 0.8)";
            }

            setTimeout(() => {
                botaoIniciar.innerText = txtOriginal;
                botaoIniciar.style.background = "rgba(76, 175, 80, 0.4)";
                botaoIniciar.disabled = false;
            }, 3000);
        }

        window.receberDadosDaBridge = function(base64Dados) {
            try {
                const jsonString = atob(base64Dados);
                const payload = JSON.parse(jsonString);

                for (const evento of payload) {
                    if (evento.type === 'update' && evento.data) {
                        for (const item of evento.data) {
                            if (item.type === 'button' && item.button && item.button.last_event === 'initial_press') {
                                if ([BOTAO_CIMA_ESQ, BOTAO_CIMA_DIR, BOTAO_BAIXO_ESQ, BOTAO_BAIXO_DIR].includes(item.id)) {
                                    if (document.getElementById('vista-rocky').style.display !== 'flex') {
                                        ativarAnimacao(item.id); 
                                    }
                                }
                            }
                        }
                    }
                }
            } catch (erro) {}
        };

        const ecra = document.getElementById('ecra');
        ecra.addEventListener('click', function(e) {
            // Garante que clicar fora de tudo aciona a animação de relógio
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON' && !e.target.classList.contains('metade-switch') && e.target.id !== 'btn-power-sala' && e.target.id !== 'btn-sync-box' && e.target.id !== 'txt-sync' && !e.target.closest('#vista-rocky') && !e.target.classList.contains('luz-hitbox')) {
                if (!document.fullscreenElement) {
                    if (ecra.requestFullscreen) ecra.requestFullscreen();
                    else if (ecra.webkitRequestFullscreen) ecra.webkitRequestFullscreen();
                }
                ativarAnimacao('touch'); 
            }
        });

        function atualizarTempo() {
            const agora = new Date();
            document.getElementById('relogio').innerHTML = String(agora.getHours()).padStart(2, '0') + ":" + String(agora.getMinutes()).padStart(2, '0');
        }

        async function getOutdoorTemp() {
            try {
                const url = `https://api.openweathermap.org/data/2.5/weather?lat=38.816&lon=-9.155&appid=8a3fe8fecca47dfc4859d6c3ef1a0214&units=metric&lang=pt`;
                const response = await fetch(url);
                const data = await response.json();
                document.getElementById('temp-out').innerText = Math.round(data.main.temp);
            } catch (e) { document.getElementById('temp-out').innerText = "Err"; }
        }

        async function getRainChance() {
            try {
                const url = `https://api.openweathermap.org/data/2.5/forecast?lat=38.816&lon=-9.155&appid=8a3fe8fecca47dfc4859d6c3ef1a0214&units=metric&lang=pt`;
                const response = await fetch(url);
                const data = await response.json();
                let maxPop = 0;
                for(let i = 0; i < 4; i++) { 
                    if(data.list[i] && data.list[i].pop > maxPop) maxPop = data.list[i].pop; 
                }
                document.getElementById('chuva-hoje').innerText = `🌧️ Chuva nas próximas 12h: ${Math.round(maxPop * 100)}%`;
            } catch (e) { document.getElementById('chuva-hoje').innerText = `🌧️ Chuva: Err`; }
        }

        async function getIndoorTemp() {
            try {
                const url = `http://${HUE_IP}/api/${HUE_TOKEN}/sensors/34`;
                const response = await fetch(url);
                const data = await response.json();
                document.getElementById('temp-in').innerText = Math.round(data.state.temperature / 100);
            } catch (e) { document.getElementById('temp-in').innerText = "Err"; }
        }

        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                function atualizarBateria() {
                    document.getElementById('txt-bateria').innerText = Math.round(battery.level * 100) + '%';
                }
                atualizarBateria(); 
                battery.addEventListener('levelchange', atualizarBateria);
            });
        }

        setInterval(atualizarTempo, 1000);
        setInterval(getOutdoorTemp, 600000); 
        setInterval(getRainChance, 600000);  
        setInterval(getIndoorTemp, 60000);   
        
        atualizarTempo();
        getOutdoorTemp();
        getRainChance();
        getIndoorTemp();
    </script>
</body>
</html>
