<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101712">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-title" content="Eddy">
  <link rel="icon" type="image/svg+xml" href="/eddy-icon.svg">
  <link rel="stylesheet" href="/frame-admin.css">
  <script src="/frame-admin.js" defer></script>
  <title>Eddy</title>
</head>
<body data-section="photos" data-network="connecting">
  <svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
    <symbol id="icon-frame" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="m4 16 4.6-4.6a1.3 1.3 0 0 1 1.8 0l2.6 2.6 1.8-1.8a1.3 1.3 0 0 1 1.8 0L20 15.6"/><circle cx="15.8" cy="9" r="1"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 11h18"/></symbol>
    <symbol id="icon-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M5 16v3a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 4v12m-5-5 5 5 5-5M5 17v2a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="5.8"/><path d="m15 15 4.5 4.5"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M9 12h6m-6 4h6"/></symbol>
    <symbol id="icon-archive" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 9h16m-10 3h4"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M19 10a7 7 0 1 0-.7 6M19 5v5h-5"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M5 7h14m-9-3h4m-7 3 .7 11a2 2 0 0 0 2 2h4.6a2 2 0 0 0 2-2L17 7m-7 4v5m4-5v5"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
  </svg>

  <main class="page">
    <header class="topbar">
      <div class="wordmark"><img src="/eddy-icon.svg" alt="" width="37" height="37"> Eddy</div>
      <div class="top-actions">
        <p class="connection" aria-live="polite"><span aria-hidden="true"></span><span id="connectionStatus">A ligar…</span></p>
        <button id="connectionSettings" class="icon-button" type="button" aria-label="Alterar ligação" hidden><svg aria-hidden="true"><use href="#icon-settings"/></svg></button>
      </div>
    </header>

    <div id="transfer" class="transfer" role="status" aria-live="polite" hidden>
      <p id="transferTitle"></p>
      <progress id="transferProgress" max="1" value="0" aria-label="Progresso do envio"></progress>
    </div>
    <div id="notice" class="notice" role="status" hidden>
      <p id="noticeMessage"></p>
      <ul id="noticeFiles" hidden></ul>
    </div>

    <section id="photoView" class="view" aria-labelledby="photoTitle">
      <div class="hero hero-photos">
        <div aria-hidden="true" class="hero-art photo-art"><i></i><i></i><i></i></div>
        <h1 id="photoTitle">Fotos</h1>
        <p id="frameStatus">Moldura do tablet</p>
        <input id="filePicker" type="file" accept="image/*" multiple hidden>
        <button id="addPhotos" type="button" class="button primary" disabled><svg aria-hidden="true"><use href="#icon-add"/></svg> Adicionar fotos</button>
      </div>

      <div class="list-header">
        <h2>Álbum <span id="photoCount" hidden></span></h2>
        <button class="icon-button refresh" type="button" data-reload="photos" aria-label="Atualizar álbum"><svg aria-hidden="true"><use href="#icon-refresh"/></svg></button>
      </div>
      <div id="photoPlaceholder" class="placeholder" aria-live="polite"></div>
      <ul id="albumGrid" class="album-grid"></ul>
    </section>

    <section id="familyView" class="view" aria-labelledby="familyTitle" hidden>
      <div class="hero hero-family">
        <div aria-hidden="true" class="hero-art family-art"><i></i><i></i><i></i></div>
        <h1 id="familyTitle">Família</h1>
        <p id="familyVolume">Ficheiros partilhados no tablet</p>
        <input id="familyPicker" type="file" multiple hidden>
        <button id="addFiles" type="button" class="button primary" disabled><svg aria-hidden="true"><use href="#icon-upload"/></svg> Enviar ficheiros</button>
      </div>

      <div class="list-header">
        <h2>Ficheiros <span id="familyCount" hidden></span></h2>
        <button class="icon-button refresh" type="button" data-reload="family" aria-label="Atualizar ficheiros"><svg aria-hidden="true"><use href="#icon-refresh"/></svg></button>
      </div>
      <label id="searchWrap" class="search" hidden><svg aria-hidden="true"><use href="#icon-search"/></svg><input id="familySearch" type="search" placeholder="Procurar um ficheiro" aria-label="Procurar um ficheiro"></label>
      <div id="familyPlaceholder" class="placeholder" aria-live="polite"></div>
      <ul id="familyList" class="family-list"></ul>
    </section>
  </main>

  <nav id="tabs" class="tab-bar" aria-label="Áreas do Eddy">
    <button id="photoTab" type="button" aria-controls="photoView" aria-current="page" data-view="photos"><svg aria-hidden="true"><use href="#icon-frame"/></svg> Fotos</button>
    <button id="familyTab" type="button" aria-controls="familyView" data-view="family"><svg aria-hidden="true"><use href="#icon-folder"/></svg> Família</button>
  </nav>

  <dialog id="preview" class="preview" aria-labelledby="previewTitle">
    <header class="preview-top">
      <div><h2 id="previewTitle"></h2><p id="previewMeta" hidden></p></div>
      <button id="closePreview" type="button" class="icon-button" aria-label="Fechar" autofocus><svg aria-hidden="true"><use href="#icon-close"/></svg></button>
    </header>
    <div id="previewVisual" class="preview-visual" hidden>
      <img id="previewImage" alt="" decoding="async" hidden>
      <pre id="previewText" hidden></pre>
      <p id="previewMessage" role="status" hidden></p>
    </div>
    <footer class="preview-footer" id="previewActions">
      <button id="removeItem" type="button" class="button danger" hidden><svg aria-hidden="true"><use href="#icon-trash"/></svg> Apagar</button>
      <a id="downloadItem" class="button primary" download hidden><svg aria-hidden="true"><use href="#icon-download"/></svg> Guardar ficheiro</a>
    </footer>
    <section class="confirmation" id="removeConfirmation" aria-labelledby="removeTitle" hidden>
      <h3 id="removeTitle">Apagar do tablet?</h3>
      <p id="removeDetail"></p>
      <div><button id="cancelRemove" type="button" class="button">Cancelar</button><button id="confirmRemove" type="button" class="button danger-fill">Apagar</button></div>
    </section>
  </dialog>
</body>
</html>
