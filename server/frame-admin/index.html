<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111713">
  <meta name="color-scheme" content="dark">
  <title>Moldura Eddy</title>
  <link rel="stylesheet" href="/frame-admin.css">
  <script src="/frame-admin.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="wordmark"><span class="frame-mark" aria-hidden="true"></span>Eddy</div>
      <p id="frameStatus" class="frame-status" hidden></p>
    </header>

    <section class="intro" aria-labelledby="title">
      <div>
        <h1 id="title">Moldura</h1>
        <p>As fotografias ficam guardadas no tablet.</p>
      </div>
      <input id="filePicker" type="file" accept="image/*" multiple hidden>
      <button id="addPhotos" type="button" class="button primary" disabled><span aria-hidden="true">＋</span> Adicionar fotos</button>
    </section>

    <p id="activity" class="message" role="status" aria-live="polite" hidden></p>
    <div id="problems" class="message problem" role="alert" hidden>
      <p id="problemText"></p>
      <ul id="problemFiles" hidden></ul>
      <button id="reload" type="button" class="button compact" hidden>Voltar a carregar</button>
    </div>

    <section aria-labelledby="albumTitle" class="album">
      <div class="album-heading">
        <h2 id="albumTitle">Fotografias</h2>
        <span id="photoCount" hidden></span>
      </div>
      <p id="loading" class="placeholder">A carregar fotografias…</p>
      <p id="empty" class="placeholder" hidden>Adiciona uma fotografia para começar.</p>
      <ul id="albumGrid" class="album-grid"></ul>
    </section>
  </main>

  <dialog id="preview" class="preview" aria-labelledby="previewTitle">
    <div class="preview-top">
      <h2 id="previewTitle"></h2>
      <button id="closePreview" type="button" class="button compact" aria-label="Fechar fotografia" autofocus>Fechar</button>
    </div>
    <figure>
      <img id="previewImage" alt="" decoding="async">
    </figure>
    <div class="preview-footer">
      <button id="removePhoto" type="button" class="button danger">Apagar foto</button>
    </div>
  </dialog>
</body>
</html>
